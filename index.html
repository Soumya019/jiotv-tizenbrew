<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <title>JioTV</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 42%, #171b26 0%, #090b10 68%);
      color: #f7f8fb;
      font-family: Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    .card { width: 760px; text-align: center; }
    .brand {
      margin: 0;
      color: #fff;
      font-size: 82px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -3px;
    }
    .brand span { color: #e63946; }
    .subtitle { margin: 24px 0 0; color: #bdc3d0; font-size: 27px; }
    .status { margin: 15px 0 0; color: #7f899c; font-size: 19px; }
    .launch {
      display: inline-block;
      margin-top: 42px;
      padding: 18px 42px;
      border: 3px solid #e63946;
      border-radius: 8px;
      background: #e63946;
      color: #fff;
      font-size: 23px;
      font-weight: 700;
      text-decoration: none;
      outline: none;
    }
    .launch:focus, .launch:hover { border-color: #fff; background: #c92332; }
    .help { margin: 36px 0 0; color: #7f899c; font-size: 17px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="brand">Jio<span>TV</span></h1>
    <p class="subtitle">Live TV and entertainment</p>
    <p class="status" id="status">Opening the official JioTV website…</p>
    <a class="launch" id="launch" href="https://jiotv.com/">Open JioTV</a>
    <p class="help">
      Press OK to open now. Press Back to stay on this screen.<br>
      Website sign-in and playback depend on JioTV and your TV’s browser support.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
