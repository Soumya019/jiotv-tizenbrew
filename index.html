<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>JioTV</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f17; color: #e8eef8;
    font-family: "SamsungOne", "Segoe UI", Roboto, sans-serif; }
  .wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  h1 { font-size: 64px; margin: 0 0 8px; letter-spacing: 1px; }
  p { margin: 8px 0; color: #9aa7bb; font-size: 22px; }
  .bar { width: 360px; height: 4px; background: #1c2740; border-radius: 2px;
    margin: 26px auto; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #3b82f6;
    animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .hint { font-size: 18px; color: #6f7d91; margin-top: 28px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <h1>JioTV</h1>
      <div class="bar"><i></i></div>
      <p>Opening jiotv.com&hellip;</p>
      <p class="hint">Press OK if the page does not load.</p>
    </div>
  </div>
<script>
  var TARGET = "https://www.jiotv.com/";
  function go() { location.replace(TARGET); }
  setTimeout(go, 700);
  document.addEventListener("keydown", function (e) {
    if (e.keyCode === 13 || e.keyCode === 29443) go();
  });
</script>
</body>
</html>
